# signalid.ru — nginx 1.24 (Ubuntu 24.04). Installed as /etc/nginx/sites-available/leadfinder,
# symlinked from sites-enabled; that directory is included inside the http {} block, so the
# map / limit_req_zone / upstream directives below are at http level. See DEPLOY.md, "Nginx".
#
# Certificates come from certbot (`certbot certonly --nginx -d signalid.ru -d www.signalid.ru`).
# /etc/letsencrypt/options-ssl-nginx.conf already sets ssl_session_cache (shared:le_nginx_SSL:10m),
# ssl_session_timeout 1440m, ssl_session_tickets off, protocols and ciphers: do not repeat them here,
# nginx refuses duplicate directives. Let's Encrypt no longer runs OCSP, so there is no stapling.

# Versioned assets (?v=<hash> from url_for) never change: cache for a year. The rest: one hour.
map $arg_v $static_cache_control {
    ""      "public, max-age=3600";
    default "public, max-age=31536000, immutable";
}

# Per client IP. Login: 10 requests a minute; API: 60 a minute. The app keeps its own limits too.
limit_req_zone $binary_remote_addr zone=signalid_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=signalid_api:10m rate=60r/m;

upstream signalid_app {
    server 127.0.0.1:8000;
    keepalive 16;
    # Below gunicorn's 2 s keep-alive, so nginx never reuses a connection gunicorn is closing.
    keepalive_timeout 1s;
}

server {
    listen 80;
    listen [::]:80;
    server_name signalid.ru www.signalid.ru;
    server_tokens off;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2 ipv6only=on;
    server_name signalid.ru www.signalid.ru;
    server_tokens off;
    client_max_body_size 2m;

    ssl_certificate /etc/letsencrypt/live/signalid.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/signalid.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript image/svg+xml application/json
               text/plain application/xml application/manifest+json;

    limit_req_status 429;

    # Shared by every location that reaches the app.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # The app trusts X-Forwarded-Host (ProxyFix x_host=1): set it here, never pass the client's value.
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;

    # Static files straight from the checkout; gunicorn has only 2 workers x 2 threads.
    # `root` rather than `alias`: same mapping (/web_static/x -> leadgen/web_static/x) without
    # alias' try_files pitfalls.
    location /web_static/ {
        root /opt/leadfinder/leadgen;
        try_files $uri =404;
        access_log off;
        add_header Cache-Control $static_cache_control;
        add_header X-Content-Type-Options nosniff always;
    }

    # Search engines fetch the icon from the site root; fall back to the app if the file is missing.
    location = /favicon.ico {
        root /opt/leadfinder/leadgen/web_static;
        try_files /favicon.ico @app;
        access_log off;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options nosniff always;
    }

    # Sign-in: the page and its form POST. /login/status (polled by the page) is not limited.
    location = /login {
        limit_req zone=signalid_login burst=10 nodelay;
        proxy_pass http://signalid_app;
    }

    # Mini App sign-in and the Telegram account login steps (phone, code, 2FA password).
    location = /tg/auth {
        limit_req zone=signalid_login burst=10 nodelay;
        proxy_pass http://signalid_app;
    }

    location ~ ^/app/telegram/(connect|code|resend|password)$ {
        limit_req zone=signalid_login burst=10 nodelay;
        proxy_pass http://signalid_app;
    }

    location /api/ {
        limit_req zone=signalid_api burst=30 nodelay;
        proxy_pass http://signalid_app;
    }

    location / {
        proxy_pass http://signalid_app;
    }

    location @app {
        proxy_pass http://signalid_app;
    }
}
