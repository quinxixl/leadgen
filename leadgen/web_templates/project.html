{% extends 'base.html' %}{% block content %}<a href="/app/projects">← Все проекты</a><h1>{{ project.name }}</h1><form method="post" class="panel"><input type="hidden" name="csrf" value="{{ csrf }}"><section class="grid two"><div><label>Название<input name="name" required maxlength="100" value="{{ project.name }}"></label><label>Описание проекта<textarea name="description" rows="4" maxlength="3000">{{ project.description }}</textarea><small>Описание для команды. Отбор сейчас задаётся полями ниже.</small></label><fieldset><legend>Услуги</legend>{% for topic in topics %}<label class="check"><input type="checkbox" name="topics" value="{{ topic }}" {% if topic in project.topics %}checked{% endif %}>{{ topic }}</label>{% endfor %}</fieldset><label>Минимальный бюджет, ₽<input name="min_budget" type="number" min="0" max="100000000" required value="{{ project.min_budget }}"></label><label>Минимальная оценка, 0–100<input name="min_score" type="number" min="0" max="100" required value="{{ project.min_score }}"></label></div><div><label>Ключевые слова — по одному на строку<textarea name="keywords" rows="5">{{ project.keywords|join('\n') }}</textarea><small>Достаточно одного совпадения. Пустое поле не ограничивает поиск словами.</small></label><label>Исключения — по одному на строку<textarea name="stop_words" rows="5">{{ project.stop_words|join('\n') }}</textarea></label><label>Точные названия источников — по одному на строку<textarea name="source_names" rows="3">{{ project.source_names|join('\n') }}</textarea><small>Скопируйте название из карточки лида. Пустое поле разрешает все доступные источники.</small></label><label class="check"><input type="checkbox" name="no_budget" {% if project.show_without_budget %}checked{% endif %}>Показывать запросы без бюджета</label><label class="check"><input type="checkbox" name="possible" {% if project.show_possible_needs %}checked{% endif %}>Показывать возможные потребности</label><label class="check"><input type="checkbox" name="enabled" {% if project.enabled %}checked{% endif %}>Включить проект</label></div></section><button>Сохранить проект</button></form>{% endblock %}
