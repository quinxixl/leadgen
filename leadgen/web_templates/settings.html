{% extends 'base.html' %}{% block head_extra %}<script src="{{ url_for('static',filename='service_picker.js') }}" defer></script>{% endblock %}{% block content %}<p class="eyebrow">Настройки общего потока</p><h1>Что искать</h1><form method="post" class="panel"><input type="hidden" name="csrf" value="{{ csrf }}">{% set selected_topics=prefs.topics %}{% include '_topic_picker.html' %}<div class="narrow form-tail"><label>Минимальный бюджет, ₽<input type="number" name="min_budget" min="0" max="100000000" required value="{{ prefs.min_budget }}"></label><label class="check"><input type="checkbox" name="no_budget" {% if prefs.show_without_budget %}checked{% endif %}>Показывать запросы без бюджета</label><label class="check"><input type="checkbox" name="possible" {% if prefs.show_possible_needs %}checked{% endif %}>Показывать возможные потребности</label><label class="check"><input type="checkbox" name="active" {% if prefs.monitoring_active %}checked{% endif %}>Получать уведомления в Telegram</label><label>Услуги и примеры работ<textarea name="portfolio" rows="6" maxlength="3000">{{ prefs.portfolio }}</textarea></label><button>Сохранить настройки</button></div></form>{% endblock %}
