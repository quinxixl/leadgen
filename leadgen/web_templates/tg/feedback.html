{% extends 'tg/base.html' %}{% block title %}Обратная связь — Сигналид{% endblock %}{% block page %}feedback{% endblock %}
{% block content %}
<form method="post" data-main-button="Отправить"><input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="context" value="{{ context }}">
<section class="tg-section">
<h2>Обратная связь</h2>
<p class="hint small">Идея, ошибка или вопрос — сообщение получит команда Сигналид.</p>
<fieldset><legend>Тип</legend>{% for key,label in kinds.items() %}<label class="check"><input type="radio" name="kind" value="{{ key }}"{% if key==kind %} checked{% endif %}><span>{{ label }}</span></label>{% endfor %}</fieldset>
<label class="field">Сообщение<textarea name="text" maxlength="4000" required>{{ text }}</textarea></label>
</section>
<button class="btn wide" data-main-fallback>Отправить</button>
</form>
{% endblock %}
