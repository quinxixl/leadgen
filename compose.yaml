services:
  leadfinder:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["python", "-m", "leadgen.app", "bot"]
    depends_on:
      db:
        condition: service_healthy
    # Caps the bot so a leak cannot push the database out of RAM (4 GB host, no swap); check with docker stats.
    mem_limit: 768m
    volumes:
      - ./leadgen/data:/app/leadgen/data
      - ./leadgen/sources.json:/app/leadgen/sources.json:ro
    # Worker heartbeat freshness (one settings lookup, 3 s statement_timeout), not `status`.
    # Until this container's worker writes its first heartbeat the check fails; start_period
    # keeps that from counting, and `up --wait` in the updater waits for the first pass.
    # Threshold: WORKER_HEARTBEAT_MAX_AGE in .env (seconds, default 300).
    healthcheck:
      test: ["CMD", "python", "-m", "leadgen.app", "healthcheck"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # Self-hosted Postgres for both stacks (compose.yaml alone and with compose.web.yaml).
  # Not published to the host: reachable only as db:5432 on the compose network.
  # Admin: docker compose exec db psql -U postgres -d leadgen (local socket). Init (first start of an empty
  # volume): deploy/postgres/init creates the app role, Supabase roles anon/authenticated and schema extensions.
  # The updater starts it with `up --no-recreate`: a config change here is applied by hand (DEPLOY.md, §16).
  db:
    # Tag and digest pinned. The major must match pg_dump/pg_restore in DEPLOY.md (PGIMG there).
    # Minor updates are manual: new tag + digest here and in DEPLOY.md, then recreate db (DEPLOY.md, §16).
    image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    restart: unless-stopped
    # POSTGRES_PASSWORD (superuser), LEADGEN_DB_USER, LEADGEN_DB_PASSWORD. Kept out of .env so the app
    # containers never see the superuser password; the app gets only its own role in DATABASE_URL.
    env_file: .env.db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: leadgen
    # Sized for a 4 GB host without swap that also runs the bot and the web app. Timeouts for the app are set
    # on its role (init script), not server-wide, so pg_dump/pg_restore/vacuum as postgres are not cut off.
    command:
      - postgres
      - -c
      - max_connections=50
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=2GB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=256MB
      - -c
      - max_wal_size=2GB
      - -c
      - min_wal_size=256MB
      - -c
      - wal_compression=lz4
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=top
      - -c
      - pg_stat_statements.track_utility=off
      - -c
      - log_min_duration_statement=1000
      - -c
      - log_lock_waits=on
      # Slow-query and error log lines must not carry bound values (tokens, phones, message text).
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
    # The kernel OOM killer picks the app containers before the database.
    oom_score_adj: -800
    # Parallel query workers use /dev/shm; Docker's default 64 MB is too small.
    shm_size: 256mb
    # Time for a clean shutdown checkpoint instead of SIGKILL and crash recovery.
    stop_grace_period: 60s
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
      # Dumps to restore are read from here (pg_restore ... /backups/<file>), not piped through stdin.
      - ./backups:/backups:ro
    # TCP check: during first-start init the server listens on the socket only, so the app waits for the real start.
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres", "-d", "leadgen"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  pgdata:
