services:
  leadfinder:
    build: .
    restart: unless-stopped
    env_file: .env
    command: ["python", "-m", "leadgen.app", "bot"]
    volumes:
      - ./leadgen/data:/app/leadgen/data
      - ./leadgen/sources.json:/app/leadgen/sources.json:ro
    healthcheck:
      test: ["CMD", "python", "-m", "leadgen.app", "status"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
